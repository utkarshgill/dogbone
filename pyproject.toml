[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogbone"
version = "0.1.0"
description = "A local KiCad viewer and MCP bridge"
requires-python = ">=3.10"
dependencies = ["kicad-python==0.7.1", "mcp==1.30.0"]

[tool.setuptools.packages.find]
include = ["dogbone"]

[tool.setuptools.package-data]
dogbone = ["web/*.html", "web/*.js", "web/LICENSE", "web/vendor/*.js", "web/utils/*.js", "web/fonts/*"]
